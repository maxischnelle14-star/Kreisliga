<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kreisliga Kickbase Live-Scorer</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        -webkit-touch-callout: none;
        user-select: none;
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #121212; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col pb-6">

    <!-- Header & Spieluhr Steuerung -->
    <header class="bg-zinc-900 border-b border-zinc-800 p-3 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex flex-col gap-2">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-xs font-bold text-red-500 tracking-wider uppercase">Kickbase Kreisliga</h1>
                    <p id="match-status" class="text-[10px] text-zinc-400 font-medium">Bereit für Anpfiff</p>
                </div>
                <!-- Timer Display -->
                <div class="flex items-center gap-2 bg-black px-3 py-1 rounded-xl border border-zinc-800">
                    <span id="timer-display" class="font-mono text-xl font-extrabold text-emerald-400">00:00</span>
                    <span id="minute-display" class="text-xs font-bold text-zinc-400 border-l border-zinc-800 pl-2">(0')</span>
                </div>
            </div>

            <!-- Spiel-Ergebnis Wähler (Für automatischen Siegbonus) -->
            <div class="flex items-center justify-between bg-zinc-950 p-1.5 rounded-xl border border-zinc-800 text-xs">
                <span class="text-[11px] font-semibold text-zinc-400 pl-1">Ergebnis:</span>
                <div class="flex gap-1">
                    <button id="res-win" onclick="setResult('win')" class="px-2.5 py-1 rounded-lg text-[10px] font-bold bg-emerald-600 text-white transition">Sieg (+15)</button>
                    <button id="res-draw" onclick="setResult('draw')" class="px-2.5 py-1 rounded-lg text-[10px] font-bold bg-zinc-800 text-zinc-400 transition">Remis (+0)</button>
                    <button id="res-loss" onclick="setResult('loss')" class="px-2.5 py-1 rounded-lg text-[10px] font-bold bg-zinc-800 text-zinc-400 transition">Niederlage (+0)</button>
                </div>
            </div>

            <!-- Controls (Anpfiff / Halbzeit / Abpfiff) -->
            <div class="flex gap-1.5 justify-between">
                <button id="btn-start" onclick="toggleTimer()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs py-1.5 rounded-lg font-bold transition active:scale-95 shadow">
                    ▶ Anpfiff
                </button>
                <button id="btn-halftime" onclick="setHalftime()" class="flex-1 bg-amber-600 hover:bg-amber-500 text-white text-xs py-1.5 rounded-lg font-bold transition active:scale-95 shadow">
                    ⏸ Halbzeit
                </button>
                <button id="btn-finish" onclick="finishGame()" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white text-xs py-1.5 rounded-lg font-bold transition active:scale-95 shadow">
                    🏁 Abpfiff
                </button>
                <button onclick="resetGame()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs px-2.5 py-1.5 rounded-lg font-bold transition active:scale-95">
                    🔄
                </button>
            </div>
        </div>
    </header>

    <div class="max-w-md mx-auto w-full flex-1 px-3 pt-3 flex flex-col gap-3">

        <!-- Header Actions: Spieler hinzufügen & Teilen -->
        <div class="flex justify-between items-center">
            <span class="text-xs font-bold uppercase text-zinc-400 tracking-wider">Spieler-Kader</span>
            <div class="flex gap-2">
                <button onclick="addPlayer()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-2.5 py-1 rounded-full font-semibold transition active:scale-95">
                    ➕ Spieler
                </button>
                <button onclick="shareScore()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1 rounded-full font-semibold transition active:scale-95">
                    📲 Teilen
                </button>
            </div>
        </div>

        <!-- Scoreboard (Dynamic Players List with In/Out Toggle) -->
        <div id="players-container" class="grid grid-cols-2 gap-2 max-h-[220px] overflow-y-auto pr-1">
            <!-- Dynamic Player Cards generated by JS -->
        </div>

        <!-- Search Bar -->
        <div class="relative">
            <input type="text" id="search-input" onkeyup="filterActions()" placeholder="🔍 Aktion suchen (z.B. Tor, Pass, Foul)..." class="w-full bg-zinc-900 border border-zinc-800 text-white rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-red-500">
        </div>

        <!-- Category Tabs -->
        <div class="flex gap-1 overflow-x-auto no-scrollbar pb-1 text-xs font-medium">
            <button onclick="setTab('all', this)" class="tab-btn bg-red-600 text-white px-3 py-1.5 rounded-lg whitespace-nowrap">Alle</button>
            <button onclick="setTab('scorer', this)" class="tab-btn bg-zinc-900 text-zinc-300 px-3 py-1.5 rounded-lg whitespace-nowrap">⚽ Scorer & Pässe</button>
            <button onclick="setTab('def', this)" class="tab-btn bg-zinc-900 text-zinc-300 px-3 py-1.5 rounded-lg whitespace-nowrap">🛡️ Zweikampf & Def</button>
            <button onclick="setTab('tw', this)" class="tab-btn bg-zinc-900 text-zinc-300 px-3 py-1.5 rounded-lg whitespace-nowrap">🧤 Torwart</button>
            <button onclick="setTab('pen', this)" class="tab-btn bg-zinc-900 text-zinc-300 px-3 py-1.5 rounded-lg whitespace-nowrap">⚠️ Strafen & Fehler</button>
            <button onclick="setTab('kreisliga', this)" class="tab-btn bg-zinc-900 text-zinc-300 px-3 py-1.5 rounded-lg whitespace-nowrap">🍺 Kreisliga Specials</button>
        </div>

        <!-- Action Grid -->
        <div id="actions-grid" class="grid grid-cols-2 gap-2 max-h-[240px] overflow-y-auto pr-1">
            <!-- Dynamic Content generated by JS -->
        </div>

        <!-- Live Ticker / History -->
        <div class="bg-zinc-900 rounded-2xl p-3 border border-zinc-800 flex-1 flex flex-col min-h-[140px]">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-bold uppercase text-zinc-400 tracking-wider">Live-Protokoll (nach Minuten)</span>
                <button onclick="undoLastAction()" class="text-xs text-amber-400 hover:underline">↩ Letzte Aktion rückgängig</button>
            </div>
            <div id="ticker-list" class="flex-1 overflow-y-auto space-y-1.5 text-xs max-h-[160px]">
                <div class="text-zinc-500 italic text-center py-4">Noch keine Aktionen erfasst...</div>
            </div>
        </div>

    </div>

    <!-- ABSCHLUSS-MODAL (Original Kickbase Vertikal-Balken Look) -->
    <div id="end-modal" class="fixed inset-0 bg-black/95 backdrop-blur-md z-50 hidden flex items-center justify-center p-3">
        <div class="bg-zinc-950 border border-zinc-800 rounded-3xl p-4 w-full max-w-md max-h-[92vh] flex flex-col justify-between shadow-2xl overflow-hidden">
            
            <div class="text-center mb-1">
                <span class="text-xs font-bold text-red-500 tracking-widest uppercase">SPIELTAGS-LEISTUNG</span>
                <h2 class="text-lg font-extrabold text-white">SCHLUSSPFIFF</h2>
            </div>

            <!-- ORIGINAL KICKBASE BAR CHART CONTAINER -->
            <div id="kickbase-bars-container" class="flex justify-around items-end h-[260px] bg-zinc-900/50 rounded-2xl p-4 border border-zinc-800/80 my-2 gap-2 overflow-x-auto">
                <!-- Vertical Bars dynamically inserted here -->
            </div>

            <!-- Detail-Ansicht für ausgewählten Spieler -->
            <div id="player-detail-box" class="bg-zinc-900 rounded-2xl p-3 border border-zinc-800 flex flex-col overflow-hidden my-1">
                <div class="flex justify-between items-center pb-1 border-b border-zinc-800 mb-2">
                    <h3 id="detail-player-name" class="font-bold text-xs text-red-400">Spieler Details</h3>
                    <span id="detail-player-score" class="font-extrabold text-xs text-emerald-400">0 Pkt.</span>
                </div>
                <div id="detail-actions-list" class="overflow-y-auto space-y-1 text-[11px] max-h-[110px] pr-1">
                    <!-- Dynamic timeline of player actions -->
                </div>
            </div>

            <div class="flex gap-2 mt-2">
                <button onclick="shareScore()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs transition active:scale-95 flex justify-center items-center gap-1">
                    <span>📲 Spieltag Teilen</span>
                </button>
                <button onclick="closeEndModal()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-bold px-4 py-2.5 rounded-xl text-xs transition active:scale-95">
                    Schließen
                </button>
            </div>
        </div>
    </div>

    <script>
        const actions = [
            { name: "Tor (ST/MF)", pts: 80, cat: "scorer" },
            { name: "Tor (ABW)", pts: 100, cat: "scorer" },
            { name: "Tor (TW)", pts: 120, cat: "scorer" },
            { name: "Elfmetertor", pts: 80, cat: "scorer" },
            { name: "Torvorlage (ST/MF)", pts: 35, cat: "scorer" },
            { name: "Torvorlage (ABW)", pts: 45, cat: "scorer" },
            { name: "Torvorlage (TW)", pts: 55, cat: "scorer" },
            { name: "Tor eingeleitet", pts: 25, cat: "scorer" },
            { name: "Pass des Todes", pts: 15, cat: "scorer" },
            { name: "Abgeprallte Vorlage", pts: 15, cat: "scorer" },
            { name: "Grosschance kreiert", pts: 15, cat: "scorer" },
            { name: "Fernschusstor Bonus", pts: 10, cat: "scorer" },
            { name: "Torschuss aufs Tor", pts: 10, cat: "scorer" },
            { name: "Latte / Pfosten", pts: 10, cat: "scorer" },
            { name: "Pass gegn. Hälfte", pts: 1, cat: "scorer" },
            { name: "Pass vorderes Drittel", pts: 1, cat: "scorer" },
            { name: "Präziser langer Ball", pts: 1, cat: "scorer" },
            { name: "Flanke erfolgreich", pts: 3, cat: "scorer" },
            { name: "Gewonnener Zweikampf", pts: 5, cat: "def" },
            { name: "Ballgewinn / Geklärt", pts: 5, cat: "def" },
            { name: "Gegner ausgedribbelt", pts: 5, cat: "def" },
            { name: "Schuss geblockt (16er)", pts: 10, cat: "def" },
            { name: "Auf der Linie geklärt", pts: 15, cat: "def" },
            { name: "Zweikampf letzter Mann", pts: 15, cat: "def" },
            { name: "Ecke rausgeholt", pts: 1, cat: "def" },
            { name: "Parade / Großchance", pts: 15, cat: "tw" },
            { name: "Schuss gehalten", pts: 10, cat: "tw" },
            { name: "Ball gefangen", pts: 10, cat: "tw" },
            { name: "Elfmeter gehalten", pts: 100, cat: "tw" },
            { name: "Erfolgreicher Abwurf", pts: 1, cat: "tw" },
            { name: "Pass verloren / Fehlpass", pts: -1, cat: "pen" },
            { name: "Foulspiel", pts: -2, cat: "pen" },
            { name: "Ausgespielt worden", pts: -3, cat: "pen" },
            { name: "Abseits", pts: -3, cat: "pen" },
            { name: "Gelbe Karte", pts: -10, cat: "pen" },
            { name: "Fehler vor Torschuss", pts: -15, cat: "pen" },
            { name: "Großchance vergeben", pts: -15, cat: "pen" },
            { name: "Fehler vor Gegentor", pts: -45, cat: "pen" },
            { name: "Elfmeter verschuldet", pts: -45, cat: "pen" },
            { name: "Gelb-Rote Karte", pts: -50, cat: "pen" },
            { name: "Eigentor", pts: -60, cat: "pen" },
            { name: "Elfmeter verschossen", pts: -60, cat: "pen" },
            { name: "Rote Karte", pts: -75, cat: "pen" },
            { name: "Kiste Bier versprochen", pts: 150, cat: "kreisliga" },
            { name: "Gegner ins Aus gegrätscht", pts: 40, cat: "kreisliga" },
            { name: "Tunnel kassiert", pts: -30, cat: "kreisliga" },
            { name: "Peinliche Schwalbe", pts: -50, cat: "kreisliga" },
            { name: "Ball über den Zaun gebolzt", pts: -20, cat: "kreisliga" }
        ];

        // Players structure with active status and sub history
        let players = JSON.parse(localStorage.getItem('kl_players_v3')) || [
            { id: 1, name: "Spieler 1", isOnField: true, intervals: [{ in: 0, out: null }] },
            { id: 2, name: "Spieler 2", isOnField: true, intervals: [{ in: 0, out: null }] }
        ];

        let activePlayerId = players[0]?.id || 1;
        let currentTab = 'all';
        let matchResult = 'win'; // 'win', 'draw', 'loss'
        let logs = JSON.parse(localStorage.getItem('kl_logs_v3')) || [];

        let timerInterval = null;
        let secondsElapsed = parseInt(localStorage.getItem('kl_timer_sec')) || 0;
        let isTimerRunning = false;

        function toggleTimer() {
            const btn = document.getElementById('btn-start');
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                btn.innerText = "▶ Weiter";
                btn.className = "flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs py-1.5 rounded-lg font-bold transition active:scale-95 shadow";
                document.getElementById('match-status').innerText = "Spiel pausiert";
            } else {
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    localStorage.setItem('kl_timer_sec', secondsElapsed);
                    updateTimerDisplay();
                }, 1000);
                isTimerRunning = true;
                btn.innerText = "⏸ Pause";
                btn.className = "flex-1 bg-zinc-700 hover:bg-zinc-600 text-white text-xs py-1.5 rounded-lg font-bold transition active:scale-95 shadow";
                document.getElementById('match-status').innerText = "🔴 Live - Spiel läuft";
            }
        }

        function setHalftime() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            secondsElapsed = 45 * 60;
            localStorage.setItem('kl_timer_sec', secondsElapsed);
            updateTimerDisplay();
            document.getElementById('btn-start').innerText = "▶ 2. Halbzeit";
            document.getElementById('btn-start').className = "flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs py-1.5 rounded-lg font-bold transition active:scale-95 shadow";
            document.getElementById('match-status').innerText = "⏸ Halbzeitpause";
        }

        function updateTimerDisplay() {
            const mins = Math.floor(secondsElapsed / 60);
            const secs = secondsElapsed % 60;
            document.getElementById('timer-display').innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            document.getElementById('minute-display').innerText = `(${mins + 1}')`;
        }

        function getCurrentMinute() {
            return Math.floor(secondsElapsed / 60) + 1;
        }

        function setResult(res) {
            matchResult = res;
            document.getElementById('res-win').className = res === 'win' ? "px-2.5 py-1 rounded-lg text-[10px] font-bold bg-emerald-600 text-white shadow" : "px-2.5 py-1 rounded-lg text-[10px] font-bold bg-zinc-800 text-zinc-400";
            document.getElementById('res-draw').className = res === 'draw' ? "px-2.5 py-1 rounded-lg text-[10px] font-bold bg-amber-600 text-white shadow" : "px-2.5 py-1 rounded-lg text-[10px] font-bold bg-zinc-800 text-zinc-400";
            document.getElementById('res-loss').className = res === 'loss' ? "px-2.5 py-1 rounded-lg text-[10px] font-bold bg-rose-600 text-white shadow" : "px-2.5 py-1 rounded-lg text-[10px] font-bold bg-zinc-800 text-zinc-400";
        }

        function toggleSubstitution(id, event) {
            event.stopPropagation();
            const currentMin = getCurrentMinute();
            const player = players.find(p => p.id === id);
            if (!player) return;

            if (player.isOnField) {
                // Auswechseln
                player.isOnField = false;
                if (player.intervals.length > 0) {
                    player.intervals[player.intervals.length - 1].out = currentMin;
                }
                logs.unshift({ playerId: player.id, playerName: player.name, action: " Ausgewechselt", pts: 0, minute: currentMin });
            } else {
                // Einwechseln
                player.isOnField = true;
                player.intervals.push({ in: currentMin, out: null });
                logs.unshift({ playerId: player.id, playerName: player.name, action: " Ein gewechselt", pts: 0, minute: currentMin });
            }

            saveData();
            renderPlayers();
            updateUI();
        }

        function addPlayer() {
            const newId = Date.now();
            const currentMin = getCurrentMinute();
            players.push({ id: newId, name: `Spieler ${players.length + 1}`, isOnField: true, intervals: [{ in: currentMin, out: null }] });
            activePlayerId = newId;
            saveData();
            renderPlayers();
            updateUI();
        }

        function removePlayer(id, event) {
            event.stopPropagation();
            if (players.length <= 1) return alert("Es muss mindestens ein Spieler vorhanden sein!");
            if (confirm("Spieler löschen?")) {
                players = players.filter(p => p.id !== id);
                if (activePlayerId === id) activePlayerId = players[0].id;
                saveData();
                renderPlayers();
                updateUI();
            }
        }

        function updatePlayerName(id, newName) {
            const player = players.find(p => p.id === id);
            if (player) { player.name = newName; saveData(); updateUI(); }
        }

        function renderPlayers() {
            const container = document.getElementById('players-container');
            container.innerHTML = '';

            players.forEach(p => {
                const isActive = p.id === activePlayerId;
                const card = document.createElement('div');
                card.onclick = () => { activePlayerId = p.id; renderPlayers(); };
                card.className = `p-2.5 rounded-2xl bg-zinc-900 border-2 transition-all shadow-md relative cursor-pointer ${
                    isActive ? 'border-red-500' : 'border-zinc-800'
                } ${!p.isOnField ? 'opacity-60 bg-zinc-950' : ''}`;

                card.innerHTML = `
                    <div class="flex justify-between items-center gap-1">
                        <input type="text" value="${p.name}" onchange="updatePlayerName(${p.id}, this.value)" onclick="event.stopPropagation()" class="bg-transparent font-bold text-xs text-white w-full border-b border-zinc-700 pb-0.5 focus:outline-none focus:border-red-500">
                        <button onclick="removePlayer(${p.id}, event)" class="text-zinc-500 hover:text-rose-500 text-xs px-1 font-bold">✕</button>
                    </div>
                    
                    <div class="flex justify-between items-end mt-2">
                        <div>
                            <div class="text-2xl font-extrabold text-white" id="score-p-${p.id}">0</div>
                            <span class="text-[9px] font-semibold ${p.isOnField ? 'text-emerald-400' : 'text-amber-500'}">
                                ${p.isOnField ? '🟢 Auf dem Feld' : '🔴 Ausgewechselt'}
                            </span>
                        </div>
                        <button onclick="toggleSubstitution(${p.id}, event)" class="text-[10px] px-2 py-1 rounded-lg font-bold border ${p.isOnField ? 'border-amber-500/40 text-amber-400 hover:bg-amber-500/10' : 'border-emerald-500/40 text-emerald-400 hover:bg-emerald-500/10'} transition">
                            ${p.isOnField ? '↔ Auswechseln' : '↔ Einwechseln'}
                        </button>
                    </div>

                    ${isActive ? '<span class="absolute top-1 right-1 text-[8px] bg-red-500 text-white font-bold px-1 rounded-full">AKTIV</span>' : ''}
                `;
                container.appendChild(card);
            });
        }

        function renderActions() {
            const grid = document.getElementById('actions-grid');
            grid.innerHTML = '';
            const search = document.getElementById('search-input').value.toLowerCase();

            actions.forEach(act => {
                if ((currentTab === 'all' || act.cat === currentTab) && act.name.toLowerCase().includes(search)) {
                    const btn = document.createElement('button');
                    const isPos = act.pts >= 0;
                    btn.className = `p-2 rounded-xl text-left border flex justify-between items-center transition active:scale-95 ${
                        isPos ? 'bg-zinc-900 border-emerald-500/30 text-emerald-400' : 'bg-zinc-900 border-rose-500/30 text-rose-400'
                    }`;
                    btn.onclick = () => addPoints(act.name, act.pts);
                    btn.innerHTML = `
                        <span class="text-xs font-semibold text-zinc-200">${act.name}</span>
                        <span class="text-xs font-bold px-1.5 py-0.5 rounded ${isPos ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">${act.pts > 0 ? '+' + act.pts : act.pts}</span>
                    `;
                    grid.appendChild(btn);
                }
            });
        }

        function setTab(tab, element) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.className = 'tab-btn bg-zinc-900 text-zinc-300 px-3 py-1.5 rounded-lg whitespace-nowrap');
            element.className = 'tab-btn bg-red-600 text-white px-3 py-1.5 rounded-lg whitespace-nowrap';
            renderActions();
        }

        function filterActions() { renderActions(); }

        function addPoints(actionName, pts) {
            const player = players.find(p => p.id === activePlayerId);
            if (!player) return;
            logs.unshift({ playerId: activePlayerId, playerName: player.name, action: actionName, pts: pts, minute: getCurrentMinute() });
            saveData();
            updateUI();
        }

        function undoLastAction() {
            if (logs.length > 0) { logs.shift(); saveData(); updateUI(); }
        }

        function resetGame() {
            if (confirm("Spiel zurücksetzen?")) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                secondsElapsed = 0;
                localStorage.setItem('kl_timer_sec', 0);
                document.getElementById('btn-start').innerText = "▶ Anpfiff";
                document.getElementById('match-status').innerText = "Bereit für Anpfiff";
                updateTimerDisplay();
                logs = [];
                players.forEach(p => { p.isOnField = true; p.intervals = [{ in: 0, out: null }]; });
                saveData();
                renderPlayers();
                updateUI();
            }
        }

        function saveData() {
            localStorage.setItem('kl_players_v3', JSON.stringify(players));
            localStorage.setItem('kl_logs_v3', JSON.stringify(logs));
        }

        function updateUI() {
            const scores = {};
            players.forEach(p => scores[p.id] = 0);
            const tickerList = document.getElementById('ticker-list');
            tickerList.innerHTML = '';

            logs.forEach(log => {
                if (scores[log.playerId] !== undefined) scores[log.playerId] += log.pts;
                const item = document.createElement('div');
                const isPos = log.pts >= 0;
                item.className = 'flex justify-between items-center p-1.5 bg-black/60 rounded-lg border border-zinc-800/80';
                item.innerHTML = `
                    <span class="font-medium text-zinc-300"><span class="text-zinc-500 font-mono mr-1">${log.minute}'</span> <strong class="text-red-400">${log.playerName}</strong>: ${log.action}</span>
                    <span class="font-bold ${isPos ? 'text-emerald-400' : 'text-rose-400'}">${isPos ? '+' + log.pts : log.pts}</span>
                `;
                tickerList.appendChild(item);
            });

            if (logs.length === 0) tickerList.innerHTML = '<div class="text-zinc-500 italic text-center py-4">Noch keine Aktionen erfasst...</div>';

            players.forEach(p => {
                const elem = document.getElementById(`score-p-${p.id}`);
                if (elem) elem.innerText = scores[p.id] || 0;
            });
        }

        // --- AUTOMATIC END-GAME SCORE CALCULATOR ---
        function finishGame() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            document.getElementById('match-status').innerText = "🏁 Spiel Beendet";

            const playedMinutes = Math.floor(secondsElapsed / 60) || 90;
            const winBonus = matchResult === 'win' ? 15 : 0;

            const playerScores = players.map(p => {
                // 1. Punkte aus Aktionen (Tore, Pässe etc.)
                const actionPts = logs.filter(l => l.playerId === p.id).reduce((sum, l) => sum + l.pts, 0);

                // 2. Exact Minutes Played Calculation
                let totalMinsPlayed = 0;
                p.intervals.forEach(inter => {
                    const start = inter.in;
                    const end = inter.out !== null ? inter.out : playedMinutes;
                    if (end > start) totalMinsPlayed += (end - start);
                });

                // Kickbase Minuten-Formel
                let minuteBonus = 0;
                if (totalMinsPlayed >= 90) {
                    minuteBonus = 10; // Volle 90 Min = 10 Extrapunkte
                } else if (totalMinsPlayed > 0) {
                    minuteBonus = Math.ceil(totalMinsPlayed / 10); // 1 Pkt pro angefangene 10 Min
                }

                // Nur wenn gespielt, gibt es den Siegbonus
                const matchBonus = totalMinsPlayed > 0 ? winBonus : 0;

                const totalScore = actionPts + minuteBonus + matchBonus;

                return { ...p, score: totalScore, actionPts, minuteBonus, matchBonus, minsPlayed: totalMinsPlayed };
            });

            // Dynamische Balkenhöhe berechnen
            const highestScore = Math.max(...playerScores.map(p => Math.abs(p.score)), 150);
            const container = document.getElementById('kickbase-bars-container');
            container.innerHTML = '';

            playerScores.forEach((p) => {
                let barColorClass = "bg-emerald-400";
                let textColorClass = "text-emerald-400";

                if (p.score > 150) {
                    barColorClass = "bg-amber-400"; // Gold MVP
                    textColorClass = "text-amber-400";
                } else if (p.score >= 80) {
                    barColorClass = "bg-emerald-400";
                    textColorClass = "text-emerald-400";
                } else if (p.score >= 0) {
                    barColorClass = "bg-emerald-500/80";
                    textColorClass = "text-emerald-400";
                } else {
                    barColorClass = "bg-rose-500";
                    textColorClass = "text-rose-400";
                }

                const heightPercent = Math.min(Math.max((Math.abs(p.score) / highestScore) * 100, 8), 100);

                const col = document.createElement('div');
                col.onclick = () => showPlayerDetails(p.id, p.name, p.score, p.minuteBonus, p.matchBonus, p.minsPlayed);
                col.className = "flex flex-col items-center justify-end h-full flex-1 cursor-pointer transition active:scale-95 group min-w-[60px]";

                col.innerHTML = `
                    <div class="text-xs font-bold text-zinc-300 mb-1 truncate max-w-[60px] text-center">${p.name}</div>
                    
                    <!-- BAR TRACK -->
                    <div class="w-10 bg-zinc-800/80 rounded-xl flex flex-col justify-end p-1 overflow-hidden h-[180px] relative border border-zinc-700/50">
                        <div class="${barColorClass} w-full rounded-lg transition-all duration-700 flex flex-col items-center justify-end py-1 shadow-lg" style="height: ${heightPercent}%;">
                            ${p.score > 150 ? '<span class="text-[10px] mb-1">👟</span>' : ''}
                        </div>
                    </div>

                    <!-- FOOTER INFO (POINTS & MINUTES) -->
                    <div class="text-center mt-2">
                        <div class="text-sm font-extrabold ${textColorClass}">${p.score}</div>
                        <div class="text-[10px] text-zinc-500 font-mono">${p.minsPlayed}'</div>
                    </div>
                `;
                container.appendChild(col);
            });

            if (playerScores.length > 0) {
                showPlayerDetails(playerScores[0].id, playerScores[0].name, playerScores[0].score, playerScores[0].minuteBonus, playerScores[0].matchBonus, playerScores[0].minsPlayed);
            }

            document.getElementById('end-modal').classList.remove('hidden');
        }

        function showPlayerDetails(playerId, playerName, totalScore, minBonus = 0, matchBonus = 0, minsPlayed = 0) {
            const detailBox = document.getElementById('player-detail-box');
            document.getElementById('detail-player-name').innerText = `📋 ${playerName}`;
            const detailScore = document.getElementById('detail-player-score');
            detailScore.innerText = `${totalScore} Pkt.`;
            detailScore.className = `font-extrabold text-xs ${totalScore >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;

            const playerLogs = logs.filter(l => l.playerId === playerId).slice().reverse();
            const detailList = document.getElementById('detail-actions-list');
            detailList.innerHTML = '';

            // Automatische Boni-Aufschlüsselung
            detailList.innerHTML += `
                <div class="flex justify-between items-center p-1 bg-emerald-950/40 rounded border border-emerald-800/50 text-[11px] font-semibold text-emerald-400">
                    <span>⏱️ Minutenbonus (${minsPlayed} Min. gespielt)</span>
                    <span>+${minBonus} Pkt.</span>
                </div>
                <div class="flex justify-between items-center p-1 bg-zinc-800/80 rounded border border-zinc-700/50 text-[11px] font-semibold ${matchBonus > 0 ? 'text-emerald-400' : 'text-zinc-500'}">
                    <span>🏆 Spielgewinn Bonus</span>
                    <span>+${matchBonus} Pkt.</span>
                </div>
            `;

            playerLogs.forEach(log => {
                const isPos = log.pts >= 0;
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center p-1 bg-black/60 rounded border border-zinc-800/80 text-[11px]';
                item.innerHTML = `
                    <span class="text-zinc-300"><strong class="text-amber-400 font-mono">${log.minute}'</strong> ${log.action}</span>
                    <span class="font-bold ${isPos ? 'text-emerald-400' : 'text-rose-400'}">${isPos ? '+' + log.pts : log.pts}</span>
                `;
                detailList.appendChild(item);
            });

            detailBox.classList.remove('hidden');
        }

        function closeEndModal() { document.getElementById('end-modal').classList.add('hidden'); }

        function shareScore() {
            let text = `⚽ *Kreisliga Kickbase Auswertung* ⚽\n⏱️ Spieldauer: ${Math.floor(secondsElapsed / 60)} Min.\n\n`;
            const playedMinutes = Math.floor(secondsElapsed / 60) || 90;
            const winBonus = matchResult === 'win' ? 15 : 0;

            const playerScores = players.map(p => {
                const actionPts = logs.filter(l => l.playerId === p.id).reduce((sum, l) => sum + l.pts, 0);
                let mins = 0;
                p.intervals.forEach(inter => { mins += ((inter.out !== null ? inter.out : playedMinutes) - inter.in); });
                const minBonus = mins >= 90 ? 10 : Math.ceil(mins / 10);
                return { name: p.name, score: actionPts + minBonus + (mins > 0 ? winBonus : 0) };
            }).sort((a, b) => b.score - a.score);

            playerScores.forEach((p, i) => { text += `${i + 1}. ${p.name}: ${p.score} Pkt.\n`; });

            if (navigator.share) navigator.share({ title: 'Kreisliga Kickbase', text: text });
            else window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`);
        }

        updateTimerDisplay();
        renderPlayers();
        renderActions();
        updateUI();
    </script>
</body>
